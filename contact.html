        <h1>Formulaire de contact</h1>

        <form id="contactForm" action="traitement_contact.php" method="post">
            <input type="text" id="nom" name="nom" placeholder="Noms et Prénoms " required>

            <input type="text" id="contact" name="contact" placeholder="Contact" required>

            <input type="email" id="gmail" name="gmail" placeholder="Gmail " required>

            <input type="text" id="objectif" name="objectif" placeholder="Objectifs " required>

            <textarea id="explication" name="explication" placeholder="Explications de l'objectif " required></textarea>

            <!-- Liste déroulante pour le pays -->
            <select id="pays" name="pays" required>
                <option value="" disabled selected>Choisir un pays </option>
                <option value="Cameroun">Cameroun</option>
                <option value="Gabon">Gabon</option>
                <option value="Cote d'ivoire">Cote d'Ivoire</option>
                <option value="Ghana">Ghana</option>
                <option value="Benin">Benin</option>
                <option value="Tchad">Tchad</option>
                <option value="Burkina Faso">Burkina Faso</option>
                <option value="Mali">Mali</option>
                <option value="Nigeria">Nigeria</option>
                <option value="Niger">Niger</option>
                <option value="France">France</option>
                <option value="Italie">Italie</option>
                <option value="Allemagne">Allemagne</option>
                <option value="Espagne">Espagne</option>
                <option value="Rome">Rome</option>
                <option value="Canada">Canada</option>
                <option value="USA">États-Unis</option>
            </select>

            <!-- Liste déroulante pour les langues -->
            <select id="langue" name="langue" required>
                <option value="" disabled selected>Choisir une langue </option>
                <option value="Français">Français</option>
                <option value="Italien">Italien</option>
                <option value="Arabe">Arabe</option>
                <option value="Anglais">Anglais</option>
                <option value="Espagnol">Espagnol</option>
                <option value="Allemand">Allemand</option>
                <option value="Chinois">Chinois</option>
            </select>

            <div class="buttons">
                <button type="submit">Envoyer</button>
                <button type="reset">Effacer</button>
            </div>
        </form>

        <p id="message"></p>
